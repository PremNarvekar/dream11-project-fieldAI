# Netlify Production Deployment Configuration for FieldVision AI

[build]
  base = "fieldvision-ai"
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  VITE_BACKEND_URL = "https://fieldvision-ai-backend.onrender.com"

# Proxy /api calls to live Render Backend
[[redirects]]
  from = "/api/*"
  to = "https://fieldvision-ai-backend.onrender.com/api/:splat"
  status = 200
  force = true

# SPA Fallback Routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and Performance Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
